name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reuse:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.probe.outputs.reuse }}
      run_id: ${{ steps.probe.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reuse_ci.py probe build/ci-reuse.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-reuse-proof
          path: build/ci-reuse.json
  build:
    needs: reuse
    if: needs.reuse.outputs.reuse != 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify disposable TLS certificate fixtures
        timeout-minutes: 2
        run: |
          $certificates = Join-Path $PWD 'build/tls-fixture-preflight'
          & ./scripts/test_network_certificates.ps1 -Directory $certificates
          try {
            & ./scripts/test_network_certificates.ps1 -Directory $certificates -Action Trust
          } finally {
            & ./scripts/test_network_certificates.ps1 -Directory $certificates -Action Remove
          }
      - name: Build Windows x86 runtime
        run: |
          $ruby = (Get-Command ruby.exe -ErrorAction Stop).Source
          & ./scripts/build_runtime.ps1 -BaseRuby $ruby
      - name: Verify CI build
        run: python -X utf8 -B scripts/verify_ci.py build/ci-verification
      - name: Verify VX Ace runtime
        run: python -X utf8 -B scripts/test_runtime_vxa.py build/ci-verification/vxa
      - name: Verify controls and save recovery in both engines
        run: python -X utf8 -B scripts/test_runtime_comfort.py build/ci-verification/comfort
      - name: Package binaries and notices
        run: |
          python -X utf8 -B scripts/package_runtime.py build/ci-verification build/lunetile-windows-x86
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          python -X utf8 -B scripts/package_template.py template-xp build/lunetile-windows-x86 build/lunetile-template-xp-windows-x86 build/lunetile-template-xp-diagnostics --runtime-patch build/lunetile-xp-speed-fix.zip
          if ($LASTEXITCODE -ne 0) { throw 'Template packaging failed' }
          python -X utf8 -B scripts/package_template_vxa.py template-vxa build/runtime-native/bin/Release build/lunetile-template-vxa-windows-x86 build/lunetile-template-vxa-diagnostics --editor-fix build/lunetile-vxa-editor-fix.zip --runtime-patch build/lunetile-vxa-speed-fix.zip
          if ($LASTEXITCODE -ne 0) { throw 'VX Ace template packaging failed' }
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/lunetile-template-xp-windows-x86 -DestinationPath dist/lunetile-template-xp-windows-x86.zip
          Compress-Archive -Path build/lunetile-template-xp-diagnostics -DestinationPath dist/lunetile-template-xp-diagnostics.zip
          Compress-Archive -Path build/lunetile-template-vxa-windows-x86 -DestinationPath dist/lunetile-template-vxa-windows-x86.zip
          Compress-Archive -Path build/lunetile-template-vxa-diagnostics -DestinationPath dist/lunetile-template-vxa-diagnostics.zip
          Copy-Item build/lunetile-vxa-editor-fix.zip,build/lunetile-vxa-speed-fix.zip,build/lunetile-xp-speed-fix.zip dist/
          $checksums = foreach ($asset in @('lunetile-template-xp-windows-x86.zip','lunetile-template-xp-diagnostics.zip','lunetile-template-vxa-windows-x86.zip','lunetile-template-vxa-diagnostics.zip','lunetile-vxa-editor-fix.zip','lunetile-vxa-speed-fix.zip','lunetile-xp-speed-fix.zip')) {
            $hash = (Get-FileHash (Join-Path dist $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          python -X utf8 -B scripts/reuse_ci.py stamp dist --verification build/ci-verification/summary.json --vxa build/ci-verification/vxa/summary.json
          if ($LASTEXITCODE -ne 0) { throw 'CI provenance failed' }
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lunetile-release-assets
          path: dist/*
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics
          path: |
            build/runtime-ruby-x86/**/*.log
            build/runtime-ruby-x86/**/gate.json
            build/ci-verification/*.json
            build/ci-verification/*.log
            build/ci-verification/launcher-smoke/*.json
            build/ci-verification/launcher-smoke/resolution/*.json
            build/ci-verification/launcher-smoke/resolution/window-checks.txt
            build/ci-verification/launcher-smoke/wide-config/*.json
            build/ci-verification/launcher-smoke/refresh/*.txt
            build/ci-verification/launcher-smoke/refresh/*.json
            build/ci-verification/launcher-smoke/timing-*/*.txt
            build/ci-verification/launcher-smoke/timing-*/*.json
            build/ci-verification/network/summary.json
            build/ci-verification/network/logic*/network-results.json
            build/ci-verification/network/logic*/network-finalized.json
            build/ci-verification/vxa/**/*
            build/ci-verification/comfort/**/summary.json
            build/runtime-native/bin/Release/verification-vxa.json
          if-no-files-found: ignore

  publish:
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (needs.reuse.outputs.reuse == 'true' || needs.build.result == 'success')
    needs: [reuse, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lunetile-release-assets
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.reuse.outputs.run_id || github.run_id }}
      - name: Publish experimental binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release retained; verified assets are not replaced."
            exit 0
          fi
          cd dist
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<EOF
          Experimental Windows x86 build of Lunetile. Source commit: $SOURCE_COMMIT

          Adds keyboard/XInput remapping, device-aware button prompts, configurable rumble and a controller test in the title/in-game Controls and Saves menu for freshly converted reviewed XP and VX Ace stock projects.
          Adds a separate autosave, three verified previous generations per manual/autosave file, and an explicit recovery menu. Autosaving waits for a safe map state after map setup or a non-loss battle result. Original import saves and existing manual slot formats remain separate.

          Download lunetile-template-xp-windows-x86.zip or lunetile-template-vxa-windows-x86.zip and run Game.exe. Requires Windows 11 x64, Visual C++ x86 runtime and the matching engine RTP (not bundled).
          Personal saves, backups, settings and original RGSS DLLs are excluded.

          Existing projects: preserve your original and Saves. Reconvert the reviewed original into a new directory with the current converter to install all menus/save hooks. The DLL-only update ZIPs do not update the old embedded VX Ace save helper; do not overwrite a personal project with a full template.
          Read docs/CONTROLS_SAVES.md and docs/releases/v0.1.0-alpha.16.md in the source repository for behavior, upgrade instructions and validation boundaries.

          CI checks both launcher ABI contracts, existing regression coverage and actual XP/VXA controls/save/recovery/restart scenarios. SHA256SUMS.txt verifies the ZIPs.
          Hardware gamepad feel/hot-plug, power-loss recovery, arbitrary plugins, complete campaigns and long-run endurance are not certified. Rumble request/deadline/focus-state checks are automated; no physical controller was connected for the local release validation.
          EOF
          gh release create "$RELEASE_TAG" lunetile-template-xp-windows-x86.zip lunetile-template-xp-diagnostics.zip lunetile-template-vxa-windows-x86.zip lunetile-template-vxa-diagnostics.zip lunetile-vxa-editor-fix.zip lunetile-vxa-speed-fix.zip lunetile-xp-speed-fix.zip SHA256SUMS.txt --verify-tag --draft --prerelease --title "Lunetile $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
