name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify disposable TLS certificate fixtures
        timeout-minutes: 2
        run: |
          $certificates = Join-Path $PWD 'build/tls-fixture-preflight'
          & ./scripts/test_network_certificates.ps1 -Directory $certificates
          try {
            & ./scripts/test_network_certificates.ps1 -Directory $certificates -Action Trust
          } finally {
            & ./scripts/test_network_certificates.ps1 -Directory $certificates -Action Remove
          }
      - name: Build Windows x86 runtime
        run: |
          $ruby = (Get-Command ruby.exe -ErrorAction Stop).Source
          & ./scripts/build_runtime.ps1 -BaseRuby $ruby
      - name: Verify CI build
        run: python -X utf8 -B scripts/verify_ci.py build/ci-verification
      - name: Verify VX Ace runtime
        run: python -X utf8 -B scripts/test_runtime_vxa.py build/ci-verification/vxa
      - name: Package binaries and notices
        run: |
          python -X utf8 -B scripts/package_runtime.py build/ci-verification build/lunetile-windows-x86
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          python -X utf8 -B scripts/package_template.py template build/lunetile-windows-x86 build/lunetile-template-windows-x86 build/lunetile-template-diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Template packaging failed' }
          python -X utf8 -B scripts/package_template_vxa.py template-vxa build/runtime-native/bin/Release build/lunetile-template-vxa-windows-x86 build/lunetile-template-vxa-diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'VX Ace template packaging failed' }
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/lunetile-template-windows-x86 -DestinationPath dist/lunetile-template-windows-x86.zip
          Compress-Archive -Path build/lunetile-template-diagnostics -DestinationPath dist/lunetile-template-diagnostics.zip
          Compress-Archive -Path build/lunetile-template-vxa-windows-x86 -DestinationPath dist/lunetile-template-vxa-windows-x86.zip
          Compress-Archive -Path build/lunetile-template-vxa-diagnostics -DestinationPath dist/lunetile-template-vxa-diagnostics.zip
          $checksums = foreach ($asset in @('lunetile-template-windows-x86.zip','lunetile-template-diagnostics.zip','lunetile-template-vxa-windows-x86.zip','lunetile-template-vxa-diagnostics.zip')) {
            $hash = (Get-FileHash (Join-Path dist $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lunetile-template-windows-x86
          path: dist/*
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics
          path: |
            build/runtime-ruby-x86/**/*.log
            build/runtime-ruby-x86/**/gate.json
            build/ci-verification/*.json
            build/ci-verification/*.log
            build/ci-verification/launcher-smoke/*.json
            build/ci-verification/launcher-smoke/resolution/*.json
            build/ci-verification/launcher-smoke/resolution/window-checks.txt
            build/ci-verification/launcher-smoke/wide-config/*.json
            build/ci-verification/launcher-smoke/refresh/*.txt
            build/ci-verification/launcher-smoke/refresh/*.json
            build/ci-verification/launcher-smoke/timing-*/*.txt
            build/ci-verification/launcher-smoke/timing-*/*.json
            build/ci-verification/network/summary.json
            build/ci-verification/network/logic*/network-results.json
            build/ci-verification/network/logic*/network-finalized.json
            build/ci-verification/vxa/**/*
            build/runtime-native/bin/Release/verification-vxa.json
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lunetile-template-windows-x86
          path: dist
      - name: Publish experimental binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<EOF
          Experimental Windows x86 build of Lunetile.

          Source commit: $SOURCE_COMMIT

          Download lunetile-template-windows-x86.zip for the converted game project, Game.exe, the newly built Lunetile.dll, a short README and license notices.
          Game.ini selects Library=Lunetile.dll. The original RGSS DLL is not included; RGSS exports and save paths remain compatible.
          Extract this game ZIP and run Game.exe. No Python, manual migration or diagnostics ZIP is required.
          The starting map is expanded to 40x23 tiles (1280x736 pixels), filling the 1280x720 canvas.
          Optional lunetile-template-diagnostics.zip contains verification, DLL information, migration/map changes, source/game file hashes, dependency locks and the Ruby port patch.
          VX Ace: lunetile-template-vxa-windows-x86.zip contains the separate LunetileVXA.dll and converted template-vxa project. It requires RPG Maker VX Ace RTP, which is not bundled.
          VX Ace diagnostics are in lunetile-template-vxa-diagnostics.zip; its verification-vxa.json records the actual checks for this DLL. XP test results do not certify VX Ace gameplay.
          New VX Ace saves use Saves/LunetileVXA and imported saves use Saves/Import. The original RGSS301.dll, personal saves and logs are excluded.
          SHA256SUMS.txt verifies all four ZIPs. Development documents and historical records remain in the source repository.
          Uses a 1280x720 widescreen canvas with adapted stock maps, menus, dialogue and battle UI.
          Resize/maximize the window or use Alt+Enter for aspect-preserving full screen.
          Runs stock game logic at 120Hz with default 60FPS output. Choose 40/60/120FPS in the in-game display settings.
          Adds asynchronous Ruby REST/JSON and TCP/TLS clients in Lunetile.dll. No server is contacted until game scripts explicitly call the networking API.
          See docs/NETWORKING.md in the source repository for the API and length-prefixed TCP example. No external Ruby, OpenSSL or networking DLL installation is required.
          XP timing is adapted from reviewed 40Hz stock scripts; VX Ace timing is adapted from its 60Hz stock scripts. Save formats and directories are engine-specific.
          Requires Windows 11 x64, the Microsoft Visual C++ x86 runtime, and the matching engine RTP: RPG Maker XP Standard RTP for XP, RPG Maker VX Ace RTP for VX Ace.

          CI verifies Python tests, Ruby x86/GC/Marshal/Fiber checks, the DLL PE/ABI contract, original-launcher smoke checks, 640x480/1280x720 rendering and window geometry, FHD/QHD/4K fit calculations, 120Hz output scheduling, 40/120Hz timing comparisons, settings/save checks, and template conversion.
          XP Korean project paths are checked only when supported by the system ANSI code page; skips are recorded in verification.json. VX Ace uses Unicode launcher paths and checks Korean paths independently.
          Networking checks use local HTTP/TCP/TLS fixture servers, including trusted TLS success on this disposable CI runner, certificate rejection, cancellation, F12 cleanup, limits and gameplay updates during delayed responses.
          Extract XP to an ASCII path on English Windows. VX Ace supports Unicode extraction paths. Full gameplay, rendering, audio, and endurance acceptance were not run for this CI build.
          The supplied template uses Standard RTP, which is not bundled. Personal saves and the original RGSS DLL are excluded.
          EOF
          gh release create "$RELEASE_TAG" lunetile-template-windows-x86.zip lunetile-template-diagnostics.zip lunetile-template-vxa-windows-x86.zip lunetile-template-vxa-diagnostics.zip SHA256SUMS.txt --verify-tag --draft --prerelease --title "Lunetile $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
